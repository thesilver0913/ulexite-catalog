name = "ulexite-catalog"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["* * * * *"] # 1分おきの1つだけ。どの分に何をするかは src/index.js の jobsAt

[vars]
GITHUB_REPO = "thesilver0913/ulexite-catalog"
GITHUB_BRANCH = "main"   # コードと静的なページ（docs/）
PAGES_BRANCH = "pages"   # Pages が配るブランチ。毎回、親のないコミット1つに上書きする

[[d1_databases]]
binding = "DB"
database_name = "ulexite-catalog"
database_id = "1a32c3a9-b132-4842-b5b1-aa49bef0a50e"

# 秘密の値は wrangler secret put で登録する（このファイルには書かない）
#   YOUTUBE_API_KEY … YouTube Data API v3 だけに制限したキー
#   GITHUB_TOKEN    … このリポジトリの Contents だけ読み書きできる fine-grained token
#   RUN_TOKEN       … 手動で動かすときの合言葉（自分で決めた長い文字列）
